router id 192.168.1.101;

protocol device {
    scan time 60;
};

protocol static {
    ipv6;
    route fd90:ebf6:7769::/48 via "lo";
};

protocol static {
    ipv4;
    route 10.200.200.0/24 via "lo";
};

protocol bgp {
    local as 65001;
    neighbor fe80::1266:6aff:fe24:7cbb%enp5s0 as 65000;

    ipv6 {
        import all;
        export all;
    };
    ipv4 {
        import all;
        export all;
        extended next hop;
    };
};

protocol kernel {
    ipv4 {
        import none;
        export all;
    };
};

protocol kernel {
    ipv6 {
        import none;
        export all;
    };
};
