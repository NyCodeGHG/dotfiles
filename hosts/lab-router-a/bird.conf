router id 192.168.1.100;

protocol device {
    scan time 60;
};

protocol static {
    ipv6;
    route fd17:460c:d9bf::/48 via "lo";
};

protocol static {
    ipv4;
    route 10.100.100.0/24 via "lo";
};

protocol bgp {
    local as 65000;
    neighbor fe80::1266:6aff:fec7:e092%enp5s0 as 65001;

    ipv6 {
        import all;
        export all;
    };
    ipv4 {
        import all;
        export all;
        extended next hop;
    };
};

protocol kernel {
    ipv4 {
        import none;
        export all;
    };
};

protocol kernel {
    ipv6 {
        import none;
        export all;
    };
};
