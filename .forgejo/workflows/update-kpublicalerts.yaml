name: Update KPublicAlerts
on:
  schedule:
    - cron: "0 14 * * Fri"
  workflow_dispatch:

enable-openid-connect: true

jobs:
  update:
    runs-on: nix-x86_64
    steps:
      - name: fetch jwt
        id: jwt
        env:
          AUD: u:1:d0de863e-2936-45ca-9cfc-927564b48134
        run: |
          jwt="$( \
            curl --fail \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD" \
            | jq -r ".value" \
          )"
          echo "::add-mask::$jwt"
          echo "jwt=$jwt" >> $FORGEJO_OUTPUT

      - name: Check out the repository
        uses: https://data.forgejo.org/actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          token: ${{ steps.jwt.outputs.jwt }}

      - name: Update
        shell: bash
        run: |
          set -eo pipefail

          echo "::group::Run nix-update"   
          COMMIT_MESSAGE="$(mktemp -t "commit-message-XXXXXX.txt")"
          nix run --inputs-from . nixpkgs#lixPackageSets.latest.nix-update -- \
            --flake \
            --version branch=master \
            --write-commit-message "$COMMIT_MESSAGE" \
            kpublicalerts
          echo "::endgroup::"

          echo "::group::Check for changes"   
          if git diff --quiet; then
            echo "No update"
            echo "::endgroup::"
            exit 0
          fi
          echo "::endgroup::"

          echo "::group::Build"   
          BUILD_LOG="$(mktemp -t "build-XXXXXX.log")"
          if nix build .#kpublicalerts -L --no-link 2>&1 | tee "$BUILD_LOG"; then
            BUILD_RESULT="success"
          else
            BUILD_RESULT="failed"
          fi
          echo "build_log=$BUILD_LOG" >> "$GITHUB_OUTPUT"
          echo "::endgroup::"

          echo "::group::Commit"
          git config user.name "Forgejo Actions"
          git config user.email "actions@git.marie.cologne"
          git switch --detach
          git commit -a --file "$COMMIT_MESSAGE"
          echo "::endgroup::"

          echo "::group::Create Pull Request"
          PR_BODY="$(mktemp -t "pr-body-XXXXX.md")"
          {
            if [[ "$BUILD_RESULT" == "success" ]]; then
              echo "**Build successful ✅**"
            else
              echo "**Build failed ❌**"
            fi
            echo
            echo "Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Full build log: uploaded as the \`build-log\` workflow artifact."
            echo
            echo "<details><summary>Last lines of the build log</summary>"
            echo
            echo '```'
            tail -c 4000 "$BUILD_LOG"
            echo '```'
            echo "</details>"
          } > "$PR_BODY"

          git push origin HEAD:refs/for/main \
            -o topic=actions/update-kpublicalerts \
            -o title="$(head -n 1 "$COMMIT_MESSAGE")" \
            -o description="{base64}$(base64 -w0 "$PR_BODY")" \
            -o force-push=true
          echo "::endgroup::"

      - name: Upload build log
        if: (success() || failure()) && steps.update.outputs.build_log != ''
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: build-log
          path: ${{ steps.update.outputs.build_log }}
          if-no-files-found: warn
